}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  padding: 20px;
}
.tile {
  background: #333;
  border-radius: 10px;
  padding: 20px;
  text-decoration: none;
  color: white;
  display: block;
}
.tile:hover {
  background: #555;
}
</style>
