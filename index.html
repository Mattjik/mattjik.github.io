<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="My Game Hub — a collection of browser games you can play instantly.">
<meta name="theme-color" content="#121216">
<title>My Game Hub</title>
<style>
:root {
  --bg: #121216;
  --panel: #1d1d24;
  --panel-hover: #272731;
  --border: #2e2e3a;
  --text: #f2f2f5;
  --muted: #9a9aab;
  --accent: #7c5cff;
  --star: #ffc940;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(18, 18, 22, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
h1 {
  margin: 0;
  font-size: 1.5rem;
  letter-spacing: 0.02em;
}
h1 span { color: var(--accent); }
.controls {
  display: flex;
  gap: 8px;
  flex: 1 1 320px;
  max-width: 560px;
}
input[type="search"] {
  flex: 1;
  min-width: 0;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  font-size: 1rem;
}
input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  font-size: 0.95rem;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--panel-hover); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.section-title {
  margin: 8px 4px 12px;
  font-size: 1rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.tile {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.tile:hover, .tile:focus-within {
  transform: translateY(-3px);
  background: var(--panel-hover);
  border-color: var(--accent);
}
.tile a {
  display: block;
  color: inherit;
  text-decoration: none;
}
.tile a:focus-visible { outline: none; }
.tile img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #0c0c10;
}
.tile .name {
  display: block;
  padding: 10px 12px 12px;
  font-weight: 600;
  line-height: 1.3;
}
.tile .note {
  display: block;
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--muted);
  margin-top: 2px;
}
.fav {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 8px;
  font-size: 1.1rem;
  line-height: 1;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.6);
  border: none;
  color: #fff;
}
.fav[aria-pressed="true"] { color: var(--star); }
.empty {
  color: var(--muted);
  text-align: center;
  padding: 40px 0;
}
footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  padding: 20px;
}
@media (prefers-reduced-motion: reduce) {
  .tile { transition: none; }
  .tile:hover, .tile:focus-within { transform: none; }
}
</style>
</head>
<body>
<header>
  <h1>My <span>Game</span> Hub</h1>
  <div class="controls">
    <input type="search" id="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
    <button type="button" id="random" title="Play a random game">🎲 Random</button>
  </div>
</header>

<main>
  <section id="favorites-section" hidden>
    <h2 class="section-title">★ Favorites</h2>
    <div class="grid" id="favorites"></div>
  </section>

  <section>
    <h2 class="section-title" id="all-title">All games</h2>
    <div class="grid" id="games"></div>
    <p class="empty" id="empty" hidden>No games match your search.</p>
  </section>
</main>

<footer id="count"></footer>

<noscript>
  <ul style="max-width:600px;margin:0 auto 40px;line-height:2">
    <li><a href="games/game1/">Cookie Clicker</a></li>
    <li><a href="games/game2/">Iron Snout</a></li>
    <li><a href="games/game3/">Basketball Stars</a></li>
    <li><a href="games/game4/">Running Fred</a></li>
    <li><a href="games/game5/">Chess</a></li>
    <li><a href="games/game6/">Shell Shockers</a></li>
    <li><a href="games/game7/">Retro Bowl</a></li>
    <li><a href="games/game8/">Masked Forces</a></li>
    <li><a href="games/game9/">Monkey Mart</a></li>
    <li><a href="games/game10/">Rooftop Snipers 2</a></li>
    <li><a href="games/game11/">Getaway Shootout</a></li>
    <li><a href="games/game12/">Slope</a></li>
    <li><a href="games/game13/">Subway Surfers</a></li>
    <li><a href="games/game14/">Happy Wheels</a></li>
    <li><a href="games/game15/">Baseball Bros</a></li>
    <li><a href="games/game16/">My Perfect Hotel</a></li>
  </ul>
</noscript>

<script>
// To add a game: drop its folder in /games and its picture in /thumbnails, then add one line here.
const GAMES = [
  { id: "game1",  name: "Cookie Clicker",    thumb: "cookieclicker.jpg" },
  { id: "game2",  name: "Iron Snout",        thumb: "ironsnout.jpg" },
  { id: "game3",  name: "Basketball Stars",  thumb: "basketballstars.jpg" },
  { id: "game4",  name: "Running Fred",      thumb: "runningfred.jpg" },
  { id: "game5",  name: "Chess",             thumb: "chess.jpg" },
  { id: "game6",  name: "Shell Shockers",    thumb: "shellshockers.jpg", note: "PC only for now" },
  { id: "game7",  name: "Retro Bowl",        thumb: "retrobowl.jpg" },
  { id: "game8",  name: "Masked Forces",     thumb: "maskedforces.jpg" },
  { id: "game9",  name: "Monkey Mart",       thumb: "monkeymart.jpg" },
  { id: "game10", name: "Rooftop Snipers 2", thumb: "rooftopsnipers.jpg" },
  { id: "game11", name: "Getaway Shootout",  thumb: "getawayshootout.jpg" },
  { id: "game12", name: "Slope",             thumb: "slope.jpg" },
  { id: "game13", name: "Subway Surfers",    thumb: "subwaysurfers.jpg" },
  { id: "game14", name: "Happy Wheels",      thumb: "happywheels.jpg" },
  { id: "game15", name: "Baseball Bros",     thumb: "baseball.jpg" },
  { id: "game16", name: "My Perfect Hotel",  thumb: "hotel.jpg" },
];

const FAV_KEY = "gamehub:favorites";
const loadFavs = () => {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); }
  catch { return new Set(); }
};
let favs = loadFavs();
const saveFavs = () => {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch {}
};

const $ = (id) => document.getElementById(id);
const gamesEl = $("games");
const favsEl = $("favorites");
const searchEl = $("search");

function tile(game) {
  const el = document.createElement("div");
  el.className = "tile";

  const link = document.createElement("a");
  link.href = `games/${game.id}/`;

  const img = document.createElement("img");
  img.src = `thumbnails/${game.thumb}`;
  img.alt = "";
  img.loading = "lazy";
  img.decoding = "async";
  img.width = 400;
  img.height = 300;

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = game.name;
  if (game.note) {
    const note = document.createElement("span");
    note.className = "note";
    note.textContent = game.note;
    name.appendChild(note);
  }

  link.append(img, name);

  const fav = document.createElement("button");
  fav.type = "button";
  fav.className = "fav";
  const isFav = favs.has(game.id);
  fav.setAttribute("aria-pressed", String(isFav));
  fav.setAttribute("aria-label", `${isFav ? "Remove" : "Add"} ${game.name} ${isFav ? "from" : "to"} favorites`);
  fav.textContent = isFav ? "★" : "☆";
  fav.addEventListener("click", () => {
    favs.has(game.id) ? favs.delete(game.id) : favs.add(game.id);
    saveFavs();
    render();
  });

  el.append(link, fav);
  return el;
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const matches = GAMES.filter((g) => g.name.toLowerCase().includes(q));
  const favMatches = matches.filter((g) => favs.has(g.id));

  favsEl.replaceChildren(...favMatches.map(tile));
  $("favorites-section").hidden = favMatches.length === 0;

  gamesEl.replaceChildren(...matches.map(tile));
  $("empty").hidden = matches.length > 0;
  $("all-title").textContent = q ? `Results (${matches.length})` : "All games";
}

searchEl.addEventListener("input", render);
searchEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = gamesEl.querySelector("a");
    if (first) location.href = first.href;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
});
$("random").addEventListener("click", () => {
  const g = GAMES[Math.floor(Math.random() * GAMES.length)];
  location.href = `games/${g.id}/`;
});

$("count").textContent = `${GAMES.length} games · Press / to search · Click ☆ to add favorites`;
render();
</script>
</body>
</html>
