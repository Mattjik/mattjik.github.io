<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slope</title>
<link rel="stylesheet" href="TemplateData/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #231F20; }
  .webgl-content, #gameContainer { position: fixed !important; inset: 0; width: 100% !important; height: 100% !important; transform: none !important; }
  #slope-error {
    display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
    padding: 20px; color: #fff; text-align: center; font: 16px/1.5 system-ui, Arial, sans-serif;
  }
</style>
<script src="TemplateData/UnityProgress.js"></script>
<script src="TemplateData/unityloader41.js"></script>
</head>
<body>
<div class="webgl-content">
  <div id="gameContainer"></div>
</div>
<div id="slope-error"></div>
<script>
  function showError(msg) {
    var el = document.getElementById("slope-error");
    el.textContent = msg;
    el.style.display = "flex";
  }
  (function () {
    var c = document.createElement("canvas");
    var gl = c.getContext("webgl2") || c.getContext("webgl") || c.getContext("experimental-webgl");
    if (!gl) {
      showError("Slope needs 3D graphics (WebGL), but this browser has it turned off or blocked. Try another browser, or check get.webgl.org.");
      return;
    }
    // Skip Unity's old "not supported on mobile" popup.
    UnityLoader.SystemInfo.mobile = false;
    UnityLoader.compatibilityCheck = function (instance, onsuccess) { onsuccess(); };
    window.gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function () { UnityProgress(gameInstance, "complete"); },
        onAbort: function (what) { showError("Slope crashed while loading: " + what); },
      },
    });
  })();
</script>
</body>
</html>
