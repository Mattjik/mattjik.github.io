<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getaway Shootout</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

<div id="game-container">
  <canvas id="game" tabindex="-1"></canvas>
</div>

<script>
/*
 * Poki compatibility layer.
 * Getaway Shootout was built with the Poki Unity SDK.
 * These functions allow the game to run without the Poki website wrapper.
 */

window.initPokiBridge = function() {
  console.log("Poki bridge initialized");
};

window.PokiSDK = window.PokiSDK || {};

PokiSDK.init = function() {
  return Promise.resolve();
};

PokiSDK.gameLoadingStart = function() {};
PokiSDK.gameLoadingProgress = function() {};
PokiSDK.gameLoadingFinished = function() {};
PokiSDK.gameplayStart = function() {};
PokiSDK.gameplayStop = function() {};
PokiSDK.commercialBreak = function() {
  return Promise.resolve();
};
PokiSDK.rewardedBreak = function() {
  return Promise.resolve(false);
};
PokiSDK.happyTime = function() {};
PokiSDK.setPlayerAge = function() {};
PokiSDK.setGameplayLoading = function() {};
PokiSDK.setLoadingBar = function() {};
PokiSDK.shareableURL = function() {
  return Promise.resolve(window.location.href);
};

PokiSDK.isAdBlocked = function() {
  return Promise.resolve(false);
};


/*
 * Unity configuration
 */

const config = {
  dataUrl: "Build/1c9c9a53750a69d6bbfecc1ee4dd29e9.data",
  frameworkUrl: "Build/f5f926b8469fb93664d78809a76685ef.js",
  codeUrl: "Build/60e4e96d1c148f8a9ea7bb182d0b6a3a.wasm",

  streamingAssetsUrl: "StreamingAssets",

  companyName: "New Eich Games",
  productName: "Getaway Shootout",
  productVersion: "1.0"
};

const canvas = document.getElementById("game");

const script = document.createElement("script");

script.src = "Build/1214fbea69c5893898f0c094bddb36cf.js";

script.onload = function() {

  createUnityInstance(
    canvas,
    config,
    function(progress) {
      console.log(Math.round(progress * 100) + "%");
    }
  ).then(function(unityInstance) {

    window.unityGame = unityInstance;

    console.log("Unity game loaded successfully.");

  }).catch(function(error) {

    console.error("Unity failed to start:", error);

  });
};

script.onerror = function() {
  console.error("Failed to load Unity loader.");
};

document.body.appendChild(script);

</script>

</body>
</html>
